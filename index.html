<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>あかちゃんあそび</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none;
      font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif; }
  body { background:#FFF8EC; touch-action:none; }

  .screen { position:fixed; inset:0; display:none; }
  .screen.active { display:flex; }

  /* ---------- スタート画面（親向け） ---------- */
  #start { flex-direction:column; align-items:center; justify-content:center;
           gap:18px; padding:20px; text-align:center;
           background:linear-gradient(170deg,#FFF3D6 0%,#FFE8EE 55%,#E3F4FF 100%); }
  #mascot { width:82px; height:82px; animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-2deg); }
                   50% { transform:translateY(-8px) rotate(2deg); } }
  #start h1 { font-size:1.8rem; color:#5C4A32; letter-spacing:.1em; }
  #start .sub { color:#8a7a60; font-size:.85rem; line-height:1.7; }
  .modeBtns { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(400px,88vw); }
  .modeBtn { font-family:inherit; font-size:1.05rem; padding:12px 10px; border:none; border-radius:22px;
             color:#fff; cursor:pointer; display:flex; align-items:center; gap:10px; justify-content:flex-start;
             box-shadow:0 5px 12px rgba(92,74,50,.18), inset 0 -3px 0 rgba(0,0,0,.12); }
  .modeBtn svg { width:34px; height:34px; flex:none; }
  .modeBtn:active { transform:translateY(2px); box-shadow:0 3px 8px rgba(92,74,50,.18); }
  .modeBtn[data-mode="tap"]    { background:linear-gradient(150deg,#3DBBF5,#0087D8); }
  .modeBtn[data-mode="baa"]    { background:linear-gradient(150deg,#FFA65C,#F5762A); }
  .modeBtn[data-mode="oto"]    { background:linear-gradient(150deg,#94D95E,#5FB332); }
  .modeBtn[data-mode="oyoge"]  { background:linear-gradient(150deg,#4DD0E1,#00A0B8); }
  .modeBtn[data-mode="doko"]   { background:linear-gradient(150deg,#FFC94D,#F5A300); }
  .modeBtn[data-mode="kotoba"] { background:linear-gradient(150deg,#F585B0,#E85585); }

  /* ---------- あそび画面 ---------- */
  #play { background:#FFF8EC; transition:background 1.2s ease; }
  #stage { position:absolute; inset:0; overflow:hidden; }

  .bub { position:absolute; border-radius:50%; pointer-events:none; opacity:.35;
         animation:drift linear infinite; }
  @keyframes drift {
    0%   { transform:translateY(12vh) translateX(0) scale(1); }
    50%  { transform:translateY(-45vh) translateX(6vw) scale(1.15); }
    100% { transform:translateY(-100vh) translateX(-4vw) scale(1); }
  }

  .fx { position:absolute; transform:translate(-50%,-50%); pointer-events:none; }

  /* いないいないばあ */
  #baaStage { position:absolute; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:3vmin; }
  #baaText { font-size:8vmin; color:#5C4A32; font-weight:bold; letter-spacing:.08em;
             min-height:10vmin; }
  #baaStage:not(.revealed) #baaText { animation:textPulse 1.4s ease-in-out infinite; }
  @keyframes textPulse { 0%,100% { transform:scale(1); opacity:.85; } 50% { transform:scale(1.07); opacity:1; } }
  #baaFace { width:64vmin; height:64vmin; filter:drop-shadow(0 8px 14px rgba(92,74,50,.2)); }
  #baaFace svg { width:100%; height:100%; }
  #baaStage:not(.revealed) #baaFace { animation:sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform:rotate(-2.5deg); } 50% { transform:rotate(2.5deg); } }
  .paw { transition:transform .45s cubic-bezier(.34,1.56,.64,1);
         transform-box:fill-box; transform-origin:center; }
  #baaStage.revealed .pawL { transform:translate(-26%,55%) rotate(-35deg); }
  #baaStage.revealed .pawR { transform:translate(26%,55%) rotate(35deg); }
  #baaStage.revealed #baaFace { animation:bounce .55s ease-out; }
  @keyframes bounce {
    0% { transform:scale(.92); } 40% { transform:scale(1.08); }
    70% { transform:scale(.98); } 100% { transform:scale(1); }
  }

  /* おと */
  #otoGrid { position:absolute; inset:0; display:grid; gap:2.4vmin; padding:2.4vmin;
             grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr); }
  @media (orientation:landscape) {
    #otoGrid { grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); }
  }
  .otoCell { border-radius:5vmin; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:1vmin; position:relative; overflow:visible;
             box-shadow:0 5px 12px rgba(92,74,50,.16), inset 0 -6px 0 rgba(0,0,0,.1); }
  .otoCell svg { width:min(19vmin,72%); height:min(19vmin,58%);
                 filter:drop-shadow(0 3px 4px rgba(0,0,0,.15)); }
  .otoCell span { color:rgba(255,255,255,.95); font-size:3.4vmin; font-weight:bold;
                  text-shadow:0 1px 2px rgba(0,0,0,.15); }

  /* およげ（追視） */
  .swimmer { position:absolute; width:26vmin; height:26vmin; }
  .swimmer .flip { width:100%; height:100%; }
  .swimmer svg { width:100%; height:100%; animation:swimBob 2.2s ease-in-out infinite;
                 filter:drop-shadow(0 4px 6px rgba(0,60,80,.18)); }
  @keyframes swimBob { 0%,100% { transform:translateY(-1.6vmin); } 50% { transform:translateY(1.6vmin); } }

  /* どこかな */
  #dokoStage { position:absolute; inset:0; display:flex; flex-direction:column;
               align-items:center; justify-content:flex-start; padding-top:8vh; }
  #dokoText { font-size:7vmin; color:#5C4A32; font-weight:bold; min-height:9vmin; }
  #dokoArea { position:relative; width:100%; flex:1; }
  .cup { position:absolute; bottom:16vh; width:26vmin; height:30vmin; transform:translateX(-50%);
         z-index:2; }
  .cup svg { width:100%; height:100%; filter:drop-shadow(0 5px 8px rgba(92,74,50,.25)); }
  #dokoHiyo { position:absolute; width:17vmin; height:17vmin; z-index:1;
              transform:translateX(-50%);
              transition:left .9s ease-in-out, top .9s ease-in-out; }
  #dokoHiyo svg { width:100%; height:100%; }
  #dokoHiyo.hop { animation:hiyoHop .6s ease-in-out infinite; }
  @keyframes hiyoHop { 0%,100% { margin-top:0; } 50% { margin-top:-2.4vmin; } }

  /* ことばカード */
  #kotobaWrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .wordCard { position:absolute; width:min(72vmin,84vw); background:#fff; border-radius:7vmin;
              padding:5vmin 4vmin 4vmin; display:flex; flex-direction:column; align-items:center; gap:2vmin;
              box-shadow:0 10px 26px rgba(92,74,50,.22); }
  .wordCard svg { width:44vmin; height:44vmin; }
  .wordCard p { font-size:9.5vmin; font-weight:bold; color:#5C4A32; letter-spacing:.14em; }

  /* 親向け声かけヒント */
  #hint { position:absolute; left:0; right:0; bottom:calc(6px + env(safe-area-inset-bottom));
          text-align:center; font-size:.78rem; color:#b3a58a; pointer-events:none; }

  /* ペアレントゲート */
  #gateBtn { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px;
             width:46px; height:46px; border-radius:50%; border:none;
             background:rgba(92,74,50,.14); color:rgba(92,74,50,.55);
             font-size:20px; display:none; align-items:center; justify-content:center;
             touch-action:none; z-index:15; }
  #gateBtn.on { display:flex; }
  #gateRing { position:absolute; inset:0; border-radius:50%; }

  /* ペアレントパネル */
  #panel { align-items:center; justify-content:center; background:rgba(60,48,30,.45); z-index:20; }
  #panelBox { background:#fff; border-radius:24px; padding:24px; width:min(360px,88vw);
              display:flex; flex-direction:column; gap:16px;
              box-shadow:0 12px 30px rgba(40,30,15,.25); }
  #panelBox h2 { font-size:1.05rem; color:#5C4A32; text-align:center; }
  .panelRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .pBtn { font-family:inherit; flex:1 1 28%; padding:11px 4px; font-size:.95rem; border:none;
          border-radius:14px; background:#F0E8D8; color:#5C4A32; cursor:pointer; }
  .pBtn.sel { background:#FF8A3D; color:#fff; }
  .pBtn.quit { background:#E8DCC8; }
  #panelBox .lbl { font-size:.8rem; color:#9a8a6e; text-align:center; margin-bottom:-8px; }

  /* おしまい画面 */
  #end { background:linear-gradient(180deg,#1E2A45 0%,#2B3A55 60%,#3A4A68 100%);
         flex-direction:column; align-items:center; justify-content:center;
         gap:5vmin; z-index:10; opacity:0; transition:opacity 3s ease; }
  #end.show { opacity:1; }
  #end .moonWrap { width:42vmin; height:42vmin; animation:bob 5s ease-in-out infinite; }
  #end svg { width:100%; height:100%; }
  #end .tw { animation:twinkle 4s ease-in-out infinite; }
  #end .tw2 { animation-delay:2s; }
  @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  #end p { color:#DCE4F5; font-size:6.5vmin; letter-spacing:.15em; }
  #end .endHint { font-size:.8rem; color:#8a97b5; letter-spacing:normal; text-align:center; line-height:1.8; }
</style>
</head>
<body>

<!-- スタート画面（親が操作） -->
<div id="start" class="screen active">
  <svg id="mascot" viewBox="0 0 200 200">
    <circle cx="100" cy="104" r="72" fill="#FFD34D"/>
    <path d="M100 34 Q90 16 100 8 Q110 16 100 34" fill="#FFD34D"/>
    <circle cx="74" cy="94" r="8" fill="#3A2E1E"/><circle cx="126" cy="94" r="8" fill="#3A2E1E"/>
    <circle cx="76.5" cy="91.5" r="2.6" fill="#fff"/><circle cx="128.5" cy="91.5" r="2.6" fill="#fff"/>
    <circle cx="56" cy="118" r="12" fill="#FFB6C1" opacity=".8"/><circle cx="144" cy="118" r="12" fill="#FFB6C1" opacity=".8"/>
    <path d="M80 124 Q100 144 120 124" fill="none" stroke="#3A2E1E" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <h1>あかちゃんあそび</h1>
  <p class="sub">おうちのかたと いっしょに あそぼう。</p>
  <div class="modeBtns">
    <button class="modeBtn" data-mode="tap">
      <svg viewBox="0 0 100 100"><circle cx="42" cy="40" r="26" fill="#FF7BAC"/><path d="M42 66 Q38 78 44 88" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="72" cy="62" r="16" fill="#FFE066"/><path d="M72 78 Q70 86 74 92" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>
      たっぷ
    </button>
    <button class="modeBtn" data-mode="baa">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="34" fill="#FFD9A8"/><ellipse cx="34" cy="58" rx="15" ry="19" fill="#F5B56E" stroke="#C9873A" stroke-width="2.5"/><ellipse cx="66" cy="58" rx="15" ry="19" fill="#F5B56E" stroke="#C9873A" stroke-width="2.5"/></svg>
      ばあ
    </button>
    <button class="modeBtn" data-mode="oto">
      <svg viewBox="0 0 100 100"><path d="M64 18 L64 60 A11 11 0 1 1 57 50 L57 30 L41 34 L41 68 A11 11 0 1 1 34 58 L34 27 Z" fill="#fff"/></svg>
      おと
    </button>
    <button class="modeBtn" data-mode="oyoge">
      <svg viewBox="0 0 100 100"><ellipse cx="44" cy="52" rx="28" ry="18" fill="#FFE066"/><polygon points="68,52 90,36 90,68" fill="#FFE066"/><circle cx="30" cy="47" r="4" fill="#3A2E1E"/><circle cx="20" cy="30" r="4" fill="#fff" opacity=".8"/><circle cx="14" cy="18" r="3" fill="#fff" opacity=".6"/></svg>
      およげ
    </button>
    <button class="modeBtn" data-mode="doko">
      <svg viewBox="0 0 100 100"><path d="M32 30 L68 30 L76 84 L24 84 Z" fill="#FF7BAC"/><ellipse cx="50" cy="84" rx="26" ry="7" fill="#E85585"/><circle cx="50" cy="18" r="10" fill="#FFD34D"/></svg>
      どこかな？
    </button>
    <button class="modeBtn" data-mode="kotoba">
      <svg viewBox="0 0 100 100"><rect x="16" y="12" width="68" height="76" rx="10" fill="#fff"/><circle cx="50" cy="42" r="17" fill="#FF5A5F"/><path d="M50 26 L52 16" stroke="#7AC943" stroke-width="4" stroke-linecap="round"/><rect x="30" y="66" width="40" height="7" rx="3.5" fill="#D8CDB8"/></svg>
      なあに？
    </button>
  </div>
  <p class="sub" style="font-size:.72rem">めやすは 1かい 5ふん。おわりの じかんに なると<br>「おしまい」の がめんが でます。</p>
</div>

<!-- あそび画面 -->
<div id="play" class="screen">
  <div id="stage"></div>
  <p id="hint"></p>
</div>

<button id="gateBtn" aria-label="おうちのかた設定（0.5秒長押し）">⚙<span id="gateRing"></span></button>

<!-- ペアレントパネル -->
<div id="panel" class="screen">
  <div id="panelBox">
    <h2>おうちのかた メニュー</h2>
    <p class="lbl">あそびをかえる</p>
    <div class="panelRow" id="panelModes">
      <button class="pBtn" data-mode="tap">たっぷ</button>
      <button class="pBtn" data-mode="baa">ばあ</button>
      <button class="pBtn" data-mode="oto">おと</button>
      <button class="pBtn" data-mode="oyoge">およげ</button>
      <button class="pBtn" data-mode="doko">どこかな</button>
      <button class="pBtn" data-mode="kotoba">なあに</button>
    </div>
    <p class="lbl">おとの おおきさ</p>
    <div class="panelRow" id="panelVols">
      <button class="pBtn" data-vol="0.35">小</button>
      <button class="pBtn" data-vol="0.6">中</button>
      <button class="pBtn" data-vol="0.9">大</button>
    </div>
    <div class="panelRow">
      <button class="pBtn" id="panelResume">とじる</button>
      <button class="pBtn quit" id="panelQuit">おしまいにする</button>
    </div>
  </div>
</div>

<!-- おしまい画面 -->
<div id="end" class="screen">
  <div class="moonWrap"><svg viewBox="0 0 100 100">
    <circle cx="54" cy="46" r="26" fill="#F5E6A8"/>
    <circle cx="44" cy="40" r="24" fill="#2B3A55"/>
    <circle class="tw" cx="20" cy="20" r="2" fill="#DCE4F5"/>
    <circle class="tw tw2" cx="80" cy="16" r="1.6" fill="#DCE4F5"/>
    <circle class="tw tw2" cx="14" cy="70" r="1.4" fill="#DCE4F5"/>
    <circle class="tw" cx="86" cy="78" r="2" fill="#DCE4F5"/>
  </svg></div>
  <p>おしまい</p>
  <p class="endHint">「おしまいね、たのしかったね」と こえを かけて<br>がめんを とじて あげて ください</p>
</div>

<script>
'use strict';

/* ===================== 状態 ===================== */
const SESSION_MS = 5 * 60 * 1000;
let mode = 'tap';
let volume = 0.6;
let sessionTimer = null;
let ended = false;
let uid = 0;

/* モード内タイマー（モード切替時に一括クリア） */
let modeTimers = [];
function mt(fn, ms) { const id = setTimeout(fn, ms); modeTimers.push(id); return id; }
function clearModeTimers() { modeTimers.forEach(clearTimeout); modeTimers = []; }

/* ===================== 音（すべてWeb Audio合成・エコー付き） ===================== */
let ac = null, master = null, wet = null, noiseBuf = null;

function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = volume;
  master.connect(ac.destination);
  const delay = ac.createDelay(1);
  delay.delayTime.value = 0.26;
  const fb = ac.createGain(); fb.gain.value = 0.3;
  const wetGain = ac.createGain(); wetGain.gain.value = 0.22;
  delay.connect(fb); fb.connect(delay);
  delay.connect(wetGain); wetGain.connect(master);
  wet = delay;
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function setVolume(v) { volume = v; if (master) master.gain.value = v; }

function tone(freq, { dur = 0.5, type = 'sine', gain = 0.22, at = 0,
                     glideTo = null, glideDur = 0, echo = true, lp = 0, vib = 0 } = {}) {
  if (!ac) return;
  const t0 = ac.currentTime + at;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + (glideDur || dur));
  if (vib) {
    const lfo = ac.createOscillator(); lfo.frequency.value = 6;
    const lg = ac.createGain(); lg.gain.value = vib;
    lfo.connect(lg); lg.connect(osc.frequency);
    lfo.start(t0); lfo.stop(t0 + dur + 0.05);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let head = osc;
  if (lp) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    osc.connect(f); head = f;
  }
  head.connect(g); g.connect(master);
  if (echo) g.connect(wet);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function noiseHit({ dur = 0.15, gain = 0.2, lp = 800, at = 0 } = {}) {
  if (!ac) return;
  const t0 = ac.currentTime + at;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + dur + 0.05);
}

const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];
let pentaIdx = 0;
function soundTap() {
  const f = PENTA[pentaIdx % PENTA.length];
  pentaIdx++;
  tone(f, { dur: 0.7, type: 'triangle', gain: 0.24 });
  tone(f * 1.5, { dur: 0.5, type: 'sine', gain: 0.09 });
  tone(f * 2, { dur: 0.4, type: 'sine', gain: 0.06 });
}
function soundSparkle() {
  const f = PENTA[5 + Math.floor(Math.random() * 5)];
  tone(f * 2, { dur: 0.25, type: 'sine', gain: 0.05 });
}
function soundHide() {
  tone(392, { dur: 0.32, type: 'sine', gain: 0.14 });
  tone(329.63, { dur: 0.38, type: 'sine', gain: 0.14, at: 0.3 });
}
function soundBaa() {
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
    tone(f, { dur: 0.45, type: 'triangle', gain: 0.2, at: i * 0.09 }));
  noiseHit({ dur: 0.25, gain: 0.06, lp: 4000, at: 0.05 });
}
function soundEnd() {
  [783.99, 659.25, 523.25].forEach((f, i) =>
    tone(f, { dur: 1.3, type: 'sine', gain: 0.12, at: i * 0.75 }));
}
function soundBubble() {
  tone(500 + Math.random() * 200, { dur: 0.22, type: 'sine', gain: 0.1, glideTo: 1100, glideDur: 0.18 });
}
function soundChirp() {
  [0, 0.14].forEach(at =>
    tone(1500 + Math.random() * 300, { dur: 0.12, type: 'sine', gain: 0.12, at, glideTo: 2200 }));
}
function soundHop() {
  tone(660, { dur: 0.18, type: 'triangle', gain: 0.12, glideTo: 990, glideDur: 0.15 });
}
function soundWrong() {
  tone(330, { dur: 0.25, type: 'sine', gain: 0.1 });
  tone(294, { dur: 0.3, type: 'sine', gain: 0.1, at: 0.22 });
}
function soundSwish() {
  noiseHit({ dur: 0.16, gain: 0.07, lp: 2600 });
  tone(PENTA[pentaIdx++ % PENTA.length], { dur: 0.4, type: 'sine', gain: 0.09, at: 0.05 });
}
const OTO_SOUNDS = {
  taiko() { tone(160, { dur: 0.3, type: 'sine', gain: 0.42, glideTo: 55, glideDur: 0.22, echo: false });
            noiseHit({ dur: 0.09, gain: 0.16, lp: 600 }); },
  suzu()  { tone(1760, { dur: 0.6, type: 'sine', gain: 0.11 });
            tone(2093, { dur: 0.5, type: 'sine', gain: 0.07, at: 0.02 });
            tone(2637, { dur: 0.45, type: 'sine', gain: 0.05, at: 0.04 }); },
  nyaa()  { tone(480, { dur: 0.6, type: 'triangle', gain: 0.2, glideTo: 880, glideDur: 0.2, vib: 14 });
            tone(880, { dur: 0.35, type: 'triangle', gain: 0.12, at: 0.24, glideTo: 430, vib: 10 }); },
  piyo()  { [0, 0.18, 0.36].forEach(at =>

/* ===================== 汎用エフェクト ===================== */
const COLORS = ['#FF5A5F', '#FFB400', '#00A0E9', '#7AC943', '#FF7BAC', '#9B5DE5', '#FF8A3D'];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function fxEl(x, y, html, sizeVmin) {
  const el = document.createElement('div');
  el.className = 'fx';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = el.style.height = sizeVmin + 'vmin';
  el.innerHTML = html;
  document.getElementById('stage').appendChild(el);
  return el;
}
function animateAndRemove(el, keyframes, opts) {
  el.animate(keyframes, opts).onfinish = () => el.remove();
}

function ripple(x, y, color) {
  const el = fxEl(x, y, `<svg viewBox="0 0 100 100" style="width:100%;height:100%">
    <circle cx="50" cy="50" r="44" fill="none" stroke="${color}" stroke-width="6"/></svg>`, 30);
  animateAndRemove(el,
    [{ transform: 'translate(-50%,-50%) scale(.25)', opacity: .7 },
     { transform: 'translate(-50%,-50%) scale(1.5)', opacity: 0 }],
    { duration: 750, easing: 'ease-out' });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + Math.random() * 0.5;
    const dist = (14 + Math.random() * 14) * (Math.min(innerWidth, innerHeight) / 100);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const c = Math.random() < 0.5 ? color : pick(COLORS);
    const el = fxEl(x, y, `<svg viewBox="0 0 20 20" style="width:100%;height:100%">
      <circle cx="10" cy="10" r="8" fill="${c}"/></svg>`, 3.4);
    animateAndRemove(el,
      [{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
       { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.3)`, opacity: 0 }],
      { duration: 850 + Math.random() * 250, easing: 'cubic-bezier(.1,.6,.4,1)' });
  }
}

function confetti(cx, cy) {
  for (let i = 0; i < 20; i++) {
    const c = pick(COLORS);
    const shape = Math.random() < 0.5
      ? `<circle cx="10" cy="10" r="7" fill="${c}"/>`
      : `<rect x="3" y="5" width="14" height="10" rx="2" fill="${c}"/>`;
    const x = cx + (Math.random() - 0.5) * innerWidth * 0.4;
    const el = fxEl(x, cy, `<svg viewBox="0 0 20 20" style="width:100%;height:100%">${shape}</svg>`, 2.6);
    const drift = (Math.random() - 0.5) * 120;
    const fall = innerHeight * (0.4 + Math.random() * 0.3);
    const rot = (Math.random() - 0.5) * 540;
    animateAndRemove(el,
      [{ transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1 },
       { transform: `translate(calc(-50% + ${drift}px), calc(-50% + ${fall}px)) rotate(${rot}deg)`, opacity: 0 }],
      { duration: 1300 + Math.random() * 500, easing: 'cubic-bezier(.2,.4,.6,1)' });
  }
}

    <stop offset="0%" stop-color="color-mix(in srgb, white 45%, ${color})"/>

function spawnShape(x, y) {
  const color = pick(COLORS);
  const g = 'g' + (uid++);
  ripple(x, y, color);
  burst(x, y, color, 7);
  const el = fxEl(x, y, `<svg viewBox="0 0 100 100" style="width:100%;height:100%">
    ${gradDef(g, color)}${pick(SHAPES)(color, g)}</svg>`, 34);
  el.style.filter = 'drop-shadow(0 6px 10px rgba(92,74,50,.25))';
  animateAndRemove(el,
    [{ transform: 'translate(-50%,-50%) scale(0) rotate(-8deg)', opacity: 1 },
     { transform: 'translate(-50%,-50%) scale(1.12) rotate(3deg)', opacity: 1, offset: 0.3 },
     { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.45 },
     { transform: 'translate(-50%,-50%) scale(1.06) rotate(0deg)', opacity: 0 }],
    { duration: 1500, easing: 'ease-out' });
  const stage = document.getElementById('stage');
  const fxs = stage.querySelectorAll('.fx');
  if (fxs.length > 60) for (let i = 0; i < fxs.length - 60; i++) fxs[i].remove();
}

let lastSpark = { x: -999, y: -999 };
let sparkCount = 0;
function sparkle(x, y) {
  const dx = x - lastSpark.x, dy = y - lastSpark.y;
  if (dx * dx + dy * dy < 1600) return;
  lastSpark = { x, y };
  const c = pick(COLORS);
  const el = fxEl(x, y, `<svg viewBox="0 0 100 100" style="width:100%;height:100%">
    <path d="M50 6 L60 40 L94 50 L60 60 L50 94 L40 60 L6 50 L40 40 Z" fill="${c}"/></svg>`, 8);
  animateAndRemove(el,
    [{ transform: 'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity: 1 },
     { transform: 'translate(-50%,-50%) scale(1) rotate(60deg)', opacity: 0 }],
    { duration: 650, easing: 'ease-out' });
  if (++sparkCount % 3 === 0) soundSparkle();
}

  document.getElementById('baaText').textContent = 'ばあ！';

function spawnCreature() {
  if (mode !== 'oyoge') return;
  const stage = document.getElementById('stage');
  const def = pick(CREATURE_KINDS);
  const color = pick(def.colors);
  const fromLeft = Math.random() < 0.5;
  const el = document.createElement('div');
  el.className = 'swimmer';
  el.style.top = (12 + Math.random() * 55) + 'vh';
  el.style.left = '0px';
  /* 図柄は左向き。右へ進むときは反転（svgのぷかぷかアニメと衝突しないよう別階層で反転する） */
  el.innerHTML = `<div class="flip" style="transform:scaleX(${fromLeft ? -1 : 1})">
    <svg viewBox="0 0 200 200">${def.svg(color)}</svg></div>`;
  stage.appendChild(el);
  const w = Math.min(innerWidth, innerHeight) * 0.26;
  const startX = fromLeft ? -w : innerWidth;
  const endX = fromLeft ? innerWidth : -w;
  const dur = 9000 + Math.random() * 5000;
  let darted = false;
  const anim = el.animate(
    [{ transform: `translateX(${startX}px)` }, { transform: `translateX(${endX}px)` }],
    { duration: dur, easing: 'linear', fill: 'forwards' });
  anim.onfinish = () => { el.remove(); if (mode === 'oyoge') mt(spawnCreature, 500); };
  el.addEventListener('pointerdown', ev => {
    ev.stopPropagation();
    if (darted || mode !== 'oyoge') return;
    darted = true;
    initAudio();
    def.sound();
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, color, 6);
    /* 現在位置から一気に泳ぎ去る */
    const cur = r.left;
    anim.cancel();
    const dash = el.animate(
      [{ transform: `translateX(${cur}px)` }, { transform: `translateX(${endX}px)` }],
      { duration: 1100, easing: 'ease-in', fill: 'forwards' });
    dash.onfinish = () => { el.remove(); if (mode === 'oyoge') mt(spawnCreature, 500); };
  });
}

function dokoRound() {
  if (mode !== 'doko') return;
  const hiyo = document.getElementById('dokoHiyo');
  const text = document.getElementById('dokoText');
  if (!hiyo) return;
  dokoState = 'show';
  dokoTarget = Math.floor(Math.random() * 3);
  text.textContent = 'みててね…';
  hiyo.style.left = '50vw';
  hiyo.style.top = '6vh';
  hiyo.classList.add('hop');
  soundHop();
  /* ひよこがカップのうしろへ */
  mt(() => {
    if (mode !== 'doko') return;
    hiyo.classList.remove('hop');
    hiyo.style.left = CUP_POS[dokoTarget] + 'vw';
    const area = document.getElementById('dokoArea');
    const cup = area.querySelectorAll('.cup')[dokoTarget];
    const areaR = area.getBoundingClientRect();
    const cupR = cup.getBoundingClientRect();
    hiyo.style.top = (cupR.top - areaR.top + cupR.height * 0.28) + 'px';
    soundHop();
  }, 1400);
  mt(() => {
    if (mode !== 'doko') return;
    text.textContent = 'どこかな？';
    dokoState = 'guess';
  }, 2600);
}

function tapCup(i, cupEl) {
  if (dokoState !== 'guess') return;
  const text = document.getElementById('dokoText');
  const lift = [
    { transform: 'translateX(-50%) translateY(0) rotate(0deg)' },
    { transform: 'translateX(-50%) translateY(-20vmin) rotate(6deg)', offset: 0.35 },
    { transform: 'translateX(-50%) translateY(-20vmin) rotate(-4deg)', offset: 0.7 },
    { transform: 'translateX(-50%) translateY(0) rotate(0deg)' },
  ];
  if (i === dokoTarget) {
    dokoState = 'found';
    text.textContent = 'いたー！';
    cupEl.animate(lift.slice(0, 3), { duration: 700, easing: 'ease-out', fill: 'forwards' });
    const hiyo = document.getElementById('dokoHiyo');
    hiyo.classList.add('hop');
    soundBaa();
    const r = cupEl.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top);
    mt(dokoRound, 2200);
  } else {
    cupEl.animate(lift, { duration: 900, easing: 'ease-out' });
    text.textContent = 'あれれ？';
    soundWrong();
    mt(() => { if (dokoState === 'guess') document.getElementById('dokoText').textContent = 'どこかな？'; }, 1200);
  }
}

function nextWord() {
  if (deck.length === 0) {
    deck = WORDS.map((w, i) => i);
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
  }
  return WORDS[deck.pop()];
}

function makeCard(word) {
  const el = document.createElement('div');
  el.className = 'wordCard';
  el.innerHTML = `<svg viewBox="0 0 100 100">${word.svg}</svg><p>${word.w}</p>`;
  return el;
}

function showNextCard(first) {
  const wrap = document.getElementById('kotobaWrap');
  if (!wrap || cardBusy) return;
  cardBusy = true;
  const old = wrap.querySelector('.wordCard');
  if (old) {
    animateAndRemove(old,
      [{ transform: 'translateX(0) rotate(0deg)', opacity: 1 },
       { transform: 'translateX(-120vw) rotate(-9deg)', opacity: .6 }],
      { duration: 450, easing: 'ease-in' });
  }
  const card = makeCard(nextWord());
  wrap.appendChild(card);
  card.animate(
    [{ transform: 'translateX(120vw) rotate(9deg)' },
     { transform: 'translateX(0) rotate(0deg)' }],
    { duration: first ? 600 : 500, easing: 'cubic-bezier(.2,1.1,.4,1)' })
    .onfinish = () => { cardBusy = false; };
  if (!first) soundSwish();
}

function makeBubbles(stage) {
  for (let i = 0; i < 7; i++) {

    b.style.animationDuration = (16 + Math.random() * 14) + 's';
    b.style.animationDelay = (-Math.random() * 20) + 's';
    stage.appendChild(b);

function setMode(m) {
  mode = m;
  clearModeTimers();
  dokoState = 'idle';
  cardBusy = false;
  const stage = document.getElementById('stage');
  const play = document.getElementById('play');
  document.getElementById('hint').textContent = HINTS[m];
  stage.innerHTML = '';
  if (m === 'tap') {
    play.style.background = MODE_BG.tap;
    makeBubbles(stage);
  } else if (m === 'baa') {
    stage.innerHTML = '<div id="baaStage"><div id="baaText"></div><div id="baaFace"></div></div>';
    newAnimal();
  } else if (m === 'oto') {
    play.style.background = MODE_BG.oto;
    stage.innerHTML = '<div id="otoGrid">' + OTO_CELLS.map((c, i) =>
      `<div class="otoCell" data-i="${i}"
         style="background:linear-gradient(160deg, color-mix(in srgb, white 22%, ${c.color}), ${c.color})">
         <svg viewBox="0 0 100 100">${c.icon}</svg><span>${c.label}</span>
       </div>`).join('') + '</div>';
  } else if (m === 'oyoge') {
    play.style.background = MODE_BG.oyoge;
    makeBubbles(stage);
    spawnCreature();
    mt(spawnCreature, 3000);
  } else if (m === 'doko') {
    play.style.background = MODE_BG.doko;
    stage.innerHTML = `<div id="dokoStage"><div id="dokoText"></div><div id="dokoArea">
      ${CUP_POS.map((p, i) =>
        `<div class="cup" data-i="${i}" style="left:${p}vw">${cupSVG(CUP_COLORS[i])}</div>`).join('')}
      <div id="dokoHiyo">${hiyoSVG()}</div>
    </div></div>`;
    stage.querySelectorAll('.cup').forEach(cup =>
      cup.addEventListener('pointerdown', ev => {
        ev.stopPropagation();
        initAudio();
        tapCup(Number(cup.dataset.i), cup);
      }));
    dokoRound();
  } else if (m === 'kotoba') {
    play.style.background = MODE_BG.kotoba;
    stage.innerHTML = '<div id="kotobaWrap"></div>';
    deck = [];
    showNextCard(true);
  }
}

/* ===================== 画面遷移・セッション ===================== */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function startPlay(m) {
  initAudio();
  ended = false;
  show('play');
  gateBtn.classList.add('on');
  setMode(m);
  clearTimeout(sessionTimer);
  sessionTimer = setTimeout(showEnd, SESSION_MS);
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  try {
    if (document.documentElement.requestFullscreen && !document.fullscreenElement)
      await document.documentElement.requestFullscreen();
  } catch (e) {}
}

function showEnd() {
  ended = true;
  clearModeTimers();
  const end = document.getElementById('end');
  end.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => end.classList.add('show')));
  soundEnd();
}

function quitToStart() {
  ended = false;
  clearTimeout(sessionTimer);
  clearModeTimers();
  const end = document.getElementById('end');
  end.classList.remove('show');
  end.classList.remove('active');
  gateBtn.classList.remove('on');
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  show('start');
}

/* ===================== 入力 ===================== */
document.querySelectorAll('#start .modeBtn').forEach(btn =>
  btn.addEventListener('click', () => startPlay(btn.dataset.mode)));

const stageEl = document.getElementById('stage');
stageEl.addEventListener('pointerdown', ev => {
  if (ended) return;
  initAudio();
  if (mode === 'tap') {
    spawnShape(ev.clientX, ev.clientY);
    soundTap();
    lastSpark = { x: ev.clientX, y: ev.clientY };
  } else if (mode === 'baa') {
    if (baaState === 'hiding') revealBaa();
    else { clearModeTimers(); newAnimal(); }
  } else if (mode === 'oto') {
    const cell = ev.target.closest('.otoCell');
    if (!cell) return;
    const def = OTO_CELLS[Number(cell.dataset.i)];
    OTO_SOUNDS[def.key]();
    otoNote(cell);
    const icon = cell.querySelector('svg');
    icon.animate(def.anim, { duration: 420, easing: 'ease-out' });
  } else if (mode === 'oyoge') {
    /* 生きもの以外の場所は波紋＋あわ */
    ripple(ev.clientX, ev.clientY, 'rgba(255,255,255,.9)');
    soundBubble();
  } else if (mode === 'kotoba') {
    showNextCard(false);
  }
});
stageEl.addEventListener('pointermove', ev => {
  if (ended || mode !== 'tap') return;
  if (ev.buttons === 0 && ev.pointerType === 'mouse') return;
  sparkle(ev.clientX, ev.clientY);
});

/* ペアレントゲート: 0.5秒長押し */
const GATE_MS = 500;
const gateBtn = document.getElementById('gateBtn');
const gateRing = document.getElementById('gateRing');
let gateT0 = 0, gateRAF = 0, gateHold = null;

function gateProgress() {
  const p = Math.min(1, (performance.now() - gateT0) / GATE_MS);
  gateRing.style.background =
    `conic-gradient(rgba(92,74,50,.6) ${p * 360}deg, transparent ${p * 360}deg)`;
  if (p < 1) gateRAF = requestAnimationFrame(gateProgress);
}
function gateStart(ev) {
  ev.preventDefault(); ev.stopPropagation();
  gateT0 = performance.now();
  gateRAF = requestAnimationFrame(gateProgress);
  gateHold = setTimeout(openPanel, GATE_MS);
}
function gateCancel() {
  clearTimeout(gateHold); cancelAnimationFrame(gateRAF);
  gateRing.style.background = 'transparent';
}
gateBtn.addEventListener('pointerdown', gateStart);
gateBtn.addEventListener('pointerup', gateCancel);
gateBtn.addEventListener('pointerleave', gateCancel);
gateBtn.addEventListener('pointercancel', gateCancel);

function openPanel() {
  gateCancel();
  document.getElementById('panel').classList.add('active');
  document.querySelectorAll('#panelModes .pBtn').forEach(b =>
    b.classList.toggle('sel', b.dataset.mode === mode));
  document.querySelectorAll('#panelVols .pBtn').forEach(b =>
    b.classList.toggle('sel', Number(b.dataset.vol) === volume));
}
function closePanel() { document.getElementById('panel').classList.remove('active'); }

document.querySelectorAll('#panelModes .pBtn').forEach(b =>
  b.addEventListener('click', () => {
    closePanel();
    const end = document.getElementById('end');
    end.classList.remove('show'); end.classList.remove('active');
    ended = false;
    clearTimeout(sessionTimer);
    sessionTimer = setTimeout(showEnd, SESSION_MS);
    setMode(b.dataset.mode);
  }));
document.querySelectorAll('#panelVols .pBtn').forEach(b =>
  b.addEventListener('click', () => {
    setVolume(Number(b.dataset.vol));
    document.querySelectorAll('#panelVols .pBtn').forEach(x =>
      x.classList.toggle('sel', x === b));
    initAudio(); soundTap();
  }));
document.getElementById('panelResume').addEventListener('click', closePanel);
document.getElementById('panelQuit').addEventListener('click', () => { closePanel(); quitToStart(); });

document.addEventListener('gesturestart', ev => ev.preventDefault());
document.addEventListener('dblclick', ev => ev.preventDefault());
